  <!-- Dialog edit -->
  <dialog class="dialog-edit">
    <form id="form-edit" class="form">
      
      <div class="dialog-edit__button-close-form-edit">
        <button class="dialog-edit__button-delete" type="button">
          <img src="/assets/img/img-notice-boards/img_delete.png" alt="lixeira com a tampa aberta">
        </button>

        <button class="dialog-edit__button-close" type="button">
          <img src="/assets/img/img-notice-boards/img_close_form.png" alt="duas varinhas cruzadas num formato de x">
        </button>
      </div>

      <fieldset class="dialog-edit__fieldset">
        <legend>Alterar Aviso</legend>

        <figure class="dialog-edit__figure">
          <img src="/assets/img/img-notice-boards/img_edit.png" alt="símbolo de hogwarts sob o formulário de registro">
        </figure>

        <div class="dialog-edit__style-field dialog-edit__title">
          <label for="noticeTitle">Título<span>*</span></label>
          <input id="noticeTitle" name="noticeTitle" type="text" placeholder="Ex.: Boas-vindas e regras..." required>
        </div>

        <div class="dialog-edit__style-field dialog-edit__date">
          <label for="noticeDay">Data<span>*</span></label>
          <input id="noticeDay" name="noticeDay" type="date" required>
        </div>

        <div class="dialog-edit__style-field dialog-edit__content">
          <label for="noticeContent">Conteúdo<span>*</span></label>
          <textarea id="noticeContent" name="noticeContent" rows="4"
            placeholder="Alunos devem respeitar horários..."></textarea>
        </div>

        <div class="dialog-edit__button">
          <button class="dialog-edit__button-edit" type="submit">Selar Alterações</button>
          <button class="dialog-edit__button-cancel" type="button">Cancelar</button>
        </div>
      </fieldset>
    </form>
  </dialog>

  <!-- Dialog register -->
  <dialog class="dialog-register">
    <form id="form-register" class="form">
      
      <div class="dialog-register__button-close-form-register">
        <button class="dialog-register__button-close" type="button">
          <img src="/assets/img/img-notice-boards/img_close_form.png" alt="duas varinhas cruzadas num formato de x">
        </button>
      </div>

      <fieldset class="dialog-register__fieldset">
        <legend>Cadastrar Aviso</legend>

        <figure class="dialog-register__figure">
          <img src="/assets/img/img-notice-boards/img_form_register.png" alt="símbolo de hogwarts sob o formulário de registro">
        </figure>

        <div class="dialog-register__style-field dialog-register__title">
          <label for="noticeTitle">Título<span>*</span></label>
          <input id="noticeTitle" name="noticeTitle" type="text" placeholder="Ex.: Boas-vindas e regras..." required>
        </div>

        <div class="dialog-register__style-field dialog-register__date">
          <label for="noticeDay">Data<span>*</span></label>
          <input id="noticeDay" name="noticeDay" type="date" required>
        </div>

        <div class="dialog-register__style-field dialog-register__content">
          <label for="noticeContent">Conteúdo<span>*</span></label>
          <textarea id="noticeContent" name="noticeContent" rows="4"
            placeholder="Alunos devem respeitar horários..."></textarea>
        </div>

        <div class="dialog-register__button">
          <button class="dialog-register__button-register" type="submit">Selar Criação</button>
          <button class="dialog-register__button-cancel" type="button">Cancelar</button>
        </div>
      </fieldset>
    </form>
  </dialog>
