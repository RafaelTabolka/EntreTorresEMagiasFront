  <!-- Dialog -->
  <dialog class="dialog-edit">
    <form id="form-edit" class="form">
      <button class="dialog-edit__button-close-form-edit" type="button">
        <img src="/assets/img/img-list/img_close_form_edit.png" alt="duas varinhas cruzadas num formato de x">
      </button>

      <fieldset class="dialog-edit__fieldset">
        <legend>Dados do estudante</legend>

        <figure class="dialog-edit__figure">
          <img src="/assets/img/img-list/img_edit.png"
            alt="símbolo de hogwarts sob o formulário de registro">
        </figure>

        <div class="dialog-edit__style-field dialog-edit__complete-name">
          <label for="studentName">Nome Completo<span>*</span></label>
          <input id="studentName" name="studentName" type="text" placeholder="Ex.: Hermione Jean Granger" required>
        </div>

        <div class="dialog-edit__style-field dialog-edit__origin">
          <label for="originCountry">Origem<span>*</span></label>
          <input id="originCountry" name="originCountry" type="text" placeholder="Ex.: Londres, Vale de Godric..."
            required>
        </div>

        <div class="dialog-edit__style-field dialog-edit__houses-hogwarts">
          <label for="house">Casa de Hogwarts<span>*</span></label>
          <select id="house" name="house" required>
            <option value="">Selecione uma casa</option>
            <option value="grifinoria">Grifinória</option>
            <option value="sonserina">Sonserina</option>
            <option value="corvinal">Corvinal</option>
            <option value="lufalufa">Lufa-Lufa</option>
          </select>
        </div>

        <div class="dialog-edit__style-field dialog-edit__year">
          <label for="schoolYear">Ano em Hogwarts <span>*</span></label>
          <select id="schoolYear" name="schoolYear" required>
            <option value="">Selecione o ano</option>
            <option value="1">1º ano</option>
            <option value="2">2º ano</option>
            <option value="3">3º ano</option>
            <option value="4">4º ano</option>
            <option value="5">5º ano</option>
            <option value="6">6º ano</option>
            <option value="7">7º ano</option>
          </select>
        </div>

        <div class="dialog-edit__style-field dialog-edit__wand">
          <label for="wand">Varinha<span>*</span></label>
          <input id="wand" name="wand" type="text" placeholder="Ex: Azevinho, pena de fênix, 11''" required>
        </div>

        <div class="dialog-edit__style-field dialog-edit__blood">
          <label for="bloodStatus">Tipo de Sangue<span>*</span></label>
          <select id="bloodStatus" name="bloodStatus" required>
            <option value="">Selecione uma opção</option>
            <option value="puro">Sangue puro</option>
            <option value="mestiço">Mestiço</option>
            <option value="trouxa">Nascido trouxa</option>
            <option value="desconhecido">Desconhecido</option>
          </select>
        </div>

        <div class="dialog-edit__style-field dialog-edit__pet">
          <label for="pet">Animal de Estimação<span>*</span></label>
          <select id="pet" name="pet" required>
            <option value="">Selecione um Animal</option>
            <option value="coruja">Coruja</option>
            <option value="gato">Gato</option>
            <option value="sapo">Sapo</option>
            <option value="rato">Rato</option>
          </select>
        </div>

        <div class="dialog-edit__style-field dialog-edit__student-status">
          <label for="studentStatus">Situação do Aluno<span>*</span></label>
          <select id="studentStatus" name="studentStatus" required>
            <option value="">Selecione a situação</option>
            <option value="matriculado">Matriculado</option>
            <option value="afastado">Afastado</option>
            <option value="intercambio">Intercâmbio</option>
            <option value="expulso">Expulso</option>
            <option value="formado">Formado</option>
          </select>
        </div>

        <div class="dialog-edit__style-field dialog-edit__observations">
          <label for="headmasterNotes">Observações do Diretor</label>
          <textarea id="headmasterNotes" name="headmasterNotes" rows="4"
            placeholder="Talentos especiais, histórico familiar, advertências..."></textarea>
        </div>

        <div class="dialog-edit__button">
          <button class="dialog-edit__button-edit" type="submit">Selar Alterações</button>
          <button class="dialog-edit__button-cancel" type="button">Cancelar</button>
        </div>
      </fieldset>
    </form>
  </dialog>
